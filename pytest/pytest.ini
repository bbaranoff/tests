[pytest]
testpaths = .
python_files = test_*.py
norecursedirs = legacy archives bin __pycache__ .*
addopts = -ra --tb=short --strict-markers
markers =
    commun: vaut pour les deux couches 1
    grgsm: seulement en mode grgsm (gr-gsm dans QEMU, pont.py)
    dsp: seulement en mode dsp (c54x_exe, mask-ROM TI)
    banc_infra: demons, VTY, BTS, services, audio
    banc_couche1: couche 1 du mode, lue dans ses journaux
    banc_mobile: osmocon, mobile, camp, LU, chiffrement
    banc_reseau: MSC/HLR/STP : abonne, compteurs, SS7
    banc_actif: tests qui AGISSENT (SMS, USSD, appel, voix) — opt-in : CALYPSO_ACTIF=1
    legacy: ancienne suite (qemu/tests), banc en conteneur
